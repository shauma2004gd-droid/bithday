<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, npfollow">
<title>Для Кати ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap');

:root{
  --bg:#050207;
  --text:#f6effb;
  --muted:#b9a8c4;
  --frame:rgba(104,96,108,.64); /* рамка дополнительно затемнена */
  --frame-edge:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
body{font-family:Manrope,Arial,sans-serif}

.slideshow{position:relative;width:100%;height:100%;isolation:isolate;background:#050207}
.slide{
  position:absolute;inset:0;display:grid;place-items:center;
  opacity:0;visibility:hidden;transform:scale(1.025);
  transition:opacity .8s ease,transform 1.1s cubic-bezier(.2,.75,.2,1),visibility 0s linear .8s;
  overflow:hidden;
}
.slide.active{opacity:1;visibility:visible;transform:scale(1);transition:opacity .8s ease,transform 1.1s cubic-bezier(.2,.75,.2,1),visibility 0s}
.bg{
  position:absolute;inset:-2%;
  width:104%;height:104%;object-fit:cover;
  filter:brightness(.43) saturate(.72) contrast(1.08);
  transform:scale(1.02);
}
.vignette{
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 50% 42%,rgba(76,27,101,.20),transparent 42%),
    linear-gradient(180deg,rgba(0,0,0,.45),rgba(5,2,7,.70) 72%,rgba(5,2,7,.90));
  z-index:1;
}
.heart-layer{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.heart{
  position:absolute;bottom:-8vh;
  width:var(--s);height:var(--s);
  transform:rotate(45deg);
  opacity:var(--o);
  animation:float var(--d) linear var(--delay) infinite;
  filter:drop-shadow(0 0 8px var(--c));
}
.heart:before,.heart:after{
  content:"";position:absolute;width:100%;height:100%;
  background:var(--c);border-radius:50%;
}
.heart:before{left:-50%}
.heart:after{top:-50%}
.heart{background:var(--c);border-radius:4px}
@keyframes float{
  0%{translate:0 0;rotate:45deg}
  25%{translate:var(--x) -28vh;rotate:50deg}
  55%{translate:calc(var(--x) * -1) -58vh;rotate:39deg}
  100%{translate:var(--x) -118vh;rotate:48deg}
}

.content{position:relative;z-index:3;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vh 18px 9vh}

.polaroid{
  width:min(78vw,500px);
  height:min(79vh,650px);
  padding:clamp(13px,2.2vw,21px) clamp(13px,2.2vw,21px) clamp(68px,10vh,92px);
  background:linear-gradient(145deg,rgba(119,111,123,.67),rgba(76,70,82,.60));
  border:1px solid var(--frame-edge);
  box-shadow:
    0 24px 70px rgba(0,0,0,.78),
    0 0 0 1px rgba(0,0,0,.55) inset,
    0 0 38px rgba(113,35,155,.16);
  transform:rotate(var(--r));
  transition:transform .8s cubic-bezier(.2,.75,.2,1);
  position:relative;
  backdrop-filter:blur(1px);
}
.active .polaroid{animation:cardIn .9s cubic-bezier(.2,.75,.2,1) both}
@keyframes cardIn{
  from{opacity:0;transform:translateY(22px) scale(.94) rotate(var(--r))}
  to{opacity:1;transform:translateY(0) scale(1) rotate(var(--r))}
}
.polaroid img{
  display:block;width:100%;height:100%;object-fit:cover;
  filter:brightness(.92) saturate(.88) contrast(1.04);
  border:1px solid rgba(0,0,0,.35);
  box-shadow:0 2px 9px rgba(0,0,0,.48);
}
.polaroid:after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:18%;
  background:linear-gradient(180deg,transparent,rgba(24,20,28,.10));
  pointer-events:none;
}

.controls{
  position:absolute;left:0;right:0;bottom:clamp(7vh,10vh,12vh);
  display:flex;flex-direction:column;align-items:center;gap:20px;
}
.next{
  width:200px;height:58px;border:1px solid rgba(255,255,255,.16);
  border-radius:999px;color:white;font:600 15px Manrope,sans-serif;
  cursor:pointer;box-shadow:0 0 22px var(--glow),0 12px 35px rgba(0,0,0,.45);
  background:linear-gradient(135deg,var(--b1),var(--b2));
  transition:transform .18s ease,filter .18s ease,box-shadow .18s ease;
}
.next:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 0 30px var(--glow),0 15px 40px rgba(0,0,0,.55)}
.next:active{transform:scale(.97)}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.20);transition:.3s}
.dot.active{width:9px;height:9px;background:var(--accent);box-shadow:0 0 12px var(--accent)}

.caption{
  position:absolute;top:5.2vh;left:50%;transform:translateX(-50%);
  z-index:4;text-align:center;white-space:nowrap;
  font:600 clamp(25px,4vw,42px) "Cormorant Garamond",serif;
  letter-spacing:.03em;text-shadow:0 3px 20px rgba(0,0,0,.8);
}
.counter{
  position:absolute;top:6vh;right:22px;z-index:4;
  color:rgba(255,255,255,.55);font-size:12px;letter-spacing:.15em
}
.music{
  position:absolute;top:5.2vh;left:20px;z-index:5;
  display:none;border:1px solid rgba(255,255,255,.14);
  background:rgba(25,13,31,.60);color:#eee;border-radius:50%;
  width:42px;height:42px;cursor:pointer;backdrop-filter:blur(8px)
}
.music.show{display:block}

.start{
  position:absolute;inset:0;z-index:10;display:grid;place-items:center;
  background:radial-gradient(circle at center,rgba(44,13,57,.35),rgba(3,1,5,.96) 68%);
  transition:opacity .7s ease,visibility .7s
}
.start.hidden{opacity:0;visibility:hidden}
.start-inner{text-align:center;padding:20px}
.start h1{font:700 clamp(48px,10vw,88px) "Cormorant Garamond",serif;margin:0 0 8px}
.start p{margin:0 0 30px;color:var(--muted);font-size:14px}
.start button{width:200px;height:58px;border:0;border-radius:999px;background:linear-gradient(135deg,#7e22ce,#c026d3);color:white;font-weight:600;cursor:pointer;box-shadow:0 0 35px rgba(192,38,211,.38)}

@media(max-width:600px){
  .polaroid{width:min(84vw,420px);height:min(68vh,560px);padding:12px 12px 64px}
  .content{padding-top:7vh}
  .controls{bottom:6.5vh}
  .caption{top:4.2vh}
}
</style>
</head>
<body>
<div class="slideshow" id="slideshow"></div>

<div class="start" id="start">
  <div class="start-inner">
    <h1>Для Кати ❤️</h1>
    <p>Мое поздравление тебе❤️</p>
    <button id="startBtn">Начать</button>
  </div>
</div>

<audio id="music" loop preload="auto">
  <!-- Положи рядом с index.html файл beliy-tanec.mp3 -->
  <source src="beliy-tanec.mp3" type="audio/mpeg">
</audio>

<script>
const slides = [
  {img:"photo1.jpg", title:"Моя Самая Любимая", b1:"#6d28d9", b2:"#a855f7", accent:"#c084fc"},
  {img:"photo2.jpg", title:"Поздавляю с Днем рождения❤️", b1:"#7e22ce", b2:"#c026d3", accent:"#d946ef"},
  {img:"photo3.jpg", title:"Ты мое солнышко💕", b1:"#4f46e5", b2:"#8b5cf6", accent:"#a78bfa"},
  {img:"photo4.jpg", title:"У тебя все получится", b1:"#a21caf", b2:"#ec4899", accent:"#f0abfc"},
  {img:"photo5.jpg", title:"Я рад что мы вместе", b1:"#581c87", b2:"#9333ea", accent:"#c084fc"},
  {img:"photo6.jpg", title:"Ты самое лучшее что есть в моей жизни", b1:"#7e22ce", b2:"#db2777", accent:"#f472b6"},
  {img:"photo7.jpg", title:"С любовью Женя❤️", b1:"#4338ca", b2:"#7c3aed", accent:"#a78bfa"}
];
const colors=["#4c1d95","#5b21b6","#6d28d9","#7e22ce","#8b5cf6","#9333ea","#a855f7","#c026d3","#d946ef"];

const root=document.getElementById("slideshow");
slides.forEach((s,i)=>{
  const el=document.createElement("section");
  el.className="slide"+(i===0?" active":"");
  el.style.setProperty("--r", ([-3,2,-2.2,3,-1.7,2.4,-2.5][i])+"deg");
  el.innerHTML=`
    <img class="bg" src="${s.img}" alt="">
    <div class="vignette"></div>
    <div class="heart-layer"></div>
    <div class="caption">${s.title}</div>
    <div class="counter">${String(i+1).padStart(2,"0")} / 07</div>
    <div class="content">
      <div class="polaroid"><img src="${s.img}" alt="Фото ${i+1}"></div>
      <div class="controls">
        <button class="next" style="--b1:${s.b1};--b2:${s.b2};--glow:${s.accent}">${i===slides.length-1?"Ещё раз ❤️":"Дальше"}</button>
        <div class="dots">${slides.map((_,j)=>`<span class="dot ${j===i?"active":""}" style="--accent:${s.accent}"></span>`).join("")}</div>
      </div>
    </div>`;
  root.appendChild(el);

  const layer=el.querySelector(".heart-layer");
  for(let h=0;h<18;h++){
    const heart=document.createElement("span");
    heart.className="heart";
    const size=8+Math.random()*17;
    heart.style.setProperty("--s",size+"px");
    heart.style.setProperty("--c",colors[Math.floor(Math.random()*colors.length)]);
    heart.style.setProperty("--o",(0.18+Math.random()*0.48).toFixed(2));
    heart.style.setProperty("--d",(10+Math.random()*13).toFixed(1)+"s");
    heart.style.setProperty("--delay",(-Math.random()*18).toFixed(1)+"s");
    heart.style.setProperty("--x",(-50+Math.random()*100)+"px");
    heart.style.left=(Math.random()*100)+"%";
    layer.appendChild(heart);
  }
});

let current=0;
const els=[...document.querySelectorAll(".slide")];
const music=document.getElementById("music");
const start=document.getElementById("start");
let started=false;

function show(n){
  els[current].classList.remove("active");
  current=(n+slides.length)%slides.length;
  els[current].classList.add("active");
}
function next(){
  show(current+1);
  if(music.paused){
    music.volume=.38;
    music.play().catch(()=>{});
  }
}
document.getElementById("startBtn").addEventListener("click",()=>{
  started=true; start.classList.add("hidden");
  music.volume=.38; music.play().catch(()=>{});
});
document.querySelectorAll(".next").forEach(btn=>btn.addEventListener("click",()=>{
  if(current===slides.length-1){
    show(0);
  }else next();
}));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault(); if(started)next()}
  if(e.key==="ArrowLeft"&&started)show(current-1);
});
</script>
</body>
</html>
